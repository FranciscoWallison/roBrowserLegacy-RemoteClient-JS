name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in package.json "engines"; 24 is the version in .nvmrc.
        node-version: [22, 24]

    name: node ${{ matrix.node-version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The ESRGAN plugin is an optionalDependency fetched from GitHub; no test exercises it.
      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Syntax check every source file
        run: |
          set -e
          for f in $(git ls-files '*.js' '*.mjs'); do node --check "$f"; done

      # Needs no Ragnarok client: tests build synthetic GRFs (tests/helpers/grfBuilder.js), and the
      # fixtures under tests/fixtures total under 2 KB.
      - name: Run tests
        run: npm test
